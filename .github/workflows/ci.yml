name: Verify Fraud Radar
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: radar_test
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: radar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radar_test -d radar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://radar_test:ci-only-disposable-password@localhost:5432/radar_test
      DATABASE_URL: postgresql+psycopg://radar_test:ci-only-disposable-password@localhost:5432/radar_test
      JWT_SECRET: ci-only-disposable-signing-secret-32-chars
      BOOTSTRAP_PASSWORD: ci-only-disposable-bootstrap-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m ruff check backend ml
      - run: python -m ruff format --check backend ml
      - run: python -m pytest backend/tests -q --junitxml=reports/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-evidence
          path: reports/pytest.xml
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked dependencies and configuration
        run: >-
          docker run --rm -v "$PWD:/workspace:ro"
          aquasec/trivy:0.76.0 fs --scanners vuln
          --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed /workspace
  container-security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        if: matrix.service == 'backend'
        run: docker build -f backend/Dockerfile -t radar-backend:ci .
      - name: Build frontend image
        if: matrix.service == 'frontend'
        run: docker build -t radar-frontend:ci frontend
      - name: Scan runtime image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.0 image --scanners vuln
          --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed
          radar-${{ matrix.service }}:ci
  browser-workflow:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-disposable-browser-signing-secret-32chars
      BOOTSTRAP_USERNAME: admin
      BOOTSTRAP_PASSWORD: ci-disposable-browser-password
      RADAR_E2E_USER: admin
      RADAR_E2E_PASSWORD: ci-disposable-browser-password
      RADAR_E2E_URL: http://127.0.0.1:5177
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python -m backend.app.cli init
      - run: python -m backend.app.cli seed --transactions 1000 --seed 42
      - name: Start local services
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8017 > /tmp/radar-api.log 2>&1 &
          npm --prefix frontend run dev -- --port 5177 --strictPort > /tmp/radar-ui.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8017/ready && curl -fsS http://127.0.0.1:5177/ > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            frontend/test-results
            reports/screenshots
