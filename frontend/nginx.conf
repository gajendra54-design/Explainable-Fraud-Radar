server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /health { proxy_pass http://backend:8000; }
  location = /ready { proxy_pass http://backend:8000; }
  location = /openapi.json { proxy_pass http://backend:8000; }
  location = /docs { proxy_pass http://backend:8000; }
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 600s; }
  location / { try_files $uri $uri/ /index.html; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
}
